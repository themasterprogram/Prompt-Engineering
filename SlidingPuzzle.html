<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Puzzle Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tile {
            transition: all 0.3s ease;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
        }
        .tile:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.3);
        }
        .win-animation {
            animation: celebrate 2s ease infinite;
        }
        @keyframes celebrate {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.05); }
            50% { transform: rotate(-5deg) scale(1.05); }
            75% { transform: rotate(5deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-4xl w-full">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-600 mb-2">Sliding Puzzle</h1>
            <p class="text-gray-600">Slide the tiles to arrange them in numerical order</p>
        </header>

        <div class="flex flex-col md:flex-row gap-8 items-center justify-center">
            <div class="relative">
                <div id="puzzle-container" class="bg-white rounded-xl shadow-xl overflow-hidden relative">
                    <!-- Puzzle tiles will be generated here -->
                </div>
                <div id="win-message" class="absolute inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center rounded-xl hidden">
                    <div class="text-white text-center p-6">
                        <h2 class="text-4xl font-bold mb-4 win-animation">You Win!</h2>
                        <p class="text-xl mb-6">Congratulations on solving the puzzle!</p>
                        <button id="play-again-btn" class="bg-white text-purple-600 px-6 py-2 rounded-full font-bold hover:bg-purple-100 transition">
                            Play Again
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-lg w-full md:w-64">
                <div class="mb-6">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">Difficulty</h3>
                    <div class="flex gap-2">
                        <button data-size="3" class="puzzle-size-btn bg-purple-600 text-white px-3 py-1 rounded hover:bg-purple-700 transition">3×3</button>
                        <button data-size="4" class="puzzle-size-btn bg-gray-200 text-gray-800 px-3 py-1 rounded hover:bg-gray-300 transition">4×4</button>
                        <button data-size="5" class="puzzle-size-btn bg-gray-200 text-gray-800 px-3 py-1 rounded hover:bg-gray-300 transition">5×5</button>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">Moves</h3>
                    <div id="move-counter" class="text-2xl font-bold text-purple-600">0</div>
                </div>

                <div class="mb-6">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">Time</h3>
                    <div id="timer" class="text-2xl font-bold text-blue-600">00:00</div>
                </div>

                <div class="flex flex-col gap-2">
                    <button id="shuffle-btn" class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition flex items-center justify-center gap-2">
                        <i class="fas fa-random"></i> Shuffle
                    </button>
                    <button id="solve-btn" class="bg-gray-200 text-gray-800 py-2 rounded hover:bg-gray-300 transition flex items-center justify-center gap-2">
                        <i class="fas fa-lightbulb"></i> Show Solution
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-12 text-center text-gray-500 text-sm">
        <p>Use arrow keys or swipe tiles to move them. Have fun!</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Game state
            let puzzleSize = 3;
            let tiles = [];
            let emptyPos = { row: 0, col: 0 };
            let moveCount = 0;
            let timerInterval;
            let seconds = 0;
            let isSolving = false;
            let isGameWon = false;

            // DOM elements
            const puzzleContainer = document.getElementById('puzzle-container');
            const moveCounter = document.getElementById('move-counter');
            const timer = document.getElementById('timer');
            const winMessage = document.getElementById('win-message');
            const playAgainBtn = document.getElementById('play-again-btn');
            const shuffleBtn = document.getElementById('shuffle-btn');
            const solveBtn = document.getElementById('solve-btn');
            const sizeButtons = document.querySelectorAll('.puzzle-size-btn');

            // Initialize the game
            initGame();

            // Event listeners
            sizeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    puzzleSize = parseInt(btn.dataset.size);
                    sizeButtons.forEach(b => {
                        b.classList.remove('bg-purple-600', 'text-white');
                        b.classList.add('bg-gray-200', 'text-gray-800');
                    });
                    btn.classList.remove('bg-gray-200', 'text-gray-800');
                    btn.classList.add('bg-purple-600', 'text-white');
                    resetGame();
                });
            });

            shuffleBtn.addEventListener('click', resetGame);
            playAgainBtn.addEventListener('click', resetGame);
            solveBtn.addEventListener('click', showSolution);

            // Keyboard controls
            document.addEventListener('keydown', (e) => {
                if (isGameWon || isSolving) return;
                
                switch(e.key) {
                    case 'ArrowUp':
                        moveTile(emptyPos.row + 1, emptyPos.col);
                        break;
                    case 'ArrowDown':
                        moveTile(emptyPos.row - 1, emptyPos.col);
                        break;
                    case 'ArrowLeft':
                        moveTile(emptyPos.row, emptyPos.col + 1);
                        break;
                    case 'ArrowRight':
                        moveTile(emptyPos.row, emptyPos.col - 1);
                        break;
                }
            });

            // Initialize game
            function initGame() {
                createPuzzle();
                startTimer();
            }

            // Create puzzle board
            function createPuzzle() {
                puzzleContainer.innerHTML = '';
                puzzleContainer.style.width = `${puzzleSize * 80}px`;
                puzzleContainer.style.height = `${puzzleSize * 80}px`;

                // Create tiles
                tiles = [];
                for (let i = 0; i < puzzleSize * puzzleSize - 1; i++) {
                    tiles.push(i + 1);
                }
                tiles.push(0); // Empty space

                // Shuffle tiles
                shuffleTiles();

                // Render tiles
                renderTiles();
            }

            // Shuffle tiles
            function shuffleTiles() {
                let shuffledTiles = tiles.filter(tile => tile !== 0);
                
                // Fisher-Yates shuffle
                for (let i = shuffledTiles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledTiles[i], shuffledTiles[j]] = [shuffledTiles[j], shuffledTiles[i]];
                }
                
                // Add empty space at the end
                shuffledTiles.push(0);
                tiles = shuffledTiles;
                
                // Find empty position
                const emptyIndex = tiles.indexOf(0);
                emptyPos = {
                    row: Math.floor(emptyIndex / puzzleSize),
                    col: emptyIndex % puzzleSize
                };
                
                // Check if puzzle is solvable
                if (!isSolvable()) {
                    // If not solvable, swap first two non-empty tiles
                    if (tiles[0] === 0 || tiles[1] === 0) {
                        [tiles[2], tiles[3]] = [tiles[3], tiles[2]];
                    } else {
                        [tiles[0], tiles[1]] = [tiles[1], tiles[0]];
                    }
                }
            }

            // Check if puzzle is solvable
            function isSolvable() {
                let inversions = 0;
                const flatTiles = tiles.filter(tile => tile !== 0);
                
                for (let i = 0; i < flatTiles.length; i++) {
                    for (let j = i + 1; j < flatTiles.length; j++) {
                        if (flatTiles[i] > flatTiles[j]) {
                            inversions++;
                        }
                    }
                }
                
                // For odd grid size, inversions must be even
                if (puzzleSize % 2 === 1) {
                    return inversions % 2 === 0;
                }
                
                // For even grid size, empty row from bottom plus inversions must be odd
                const emptyRowFromBottom = puzzleSize - emptyPos.row;
                return (emptyRowFromBottom + inversions) % 2 === 1;
            }

            // Render tiles on the board
            function renderTiles() {
                puzzleContainer.innerHTML = '';
                
                tiles.forEach((tile, index) => {
                    if (tile === 0) {
                        emptyPos = {
                            row: Math.floor(index / puzzleSize),
                            col: index % puzzleSize
                        };
                        return; // Skip empty tile
                    }
                    
                    const row = Math.floor(index / puzzleSize);
                    const col = index % puzzleSize;
                    
                    const tileElement = document.createElement('div');
                    tileElement.className = `tile absolute flex items-center justify-center bg-gradient-to-br from-purple-500 to-blue-500 text-white font-bold rounded-lg cursor-pointer select-none`;
                    tileElement.textContent = tile;
                    tileElement.dataset.row = row;
                    tileElement.dataset.col = col;
                    
                    // Position the tile
                    tileElement.style.width = `calc(${100 / puzzleSize}% - 8px)`;
                    tileElement.style.height = `calc(${100 / puzzleSize}% - 8px)`;
                    tileElement.style.top = `${(row * 100) / puzzleSize}%`;
                    tileElement.style.left = `${(col * 100) / puzzleSize}%`;
                    tileElement.style.fontSize = `${Math.min(4, 40 / puzzleSize)}rem`;
                    tileElement.style.margin = '4px';
                    
                    // Add click event
                    tileElement.addEventListener('click', () => {
                        if (!isGameWon && !isSolving) {
                            moveTile(row, col);
                        }
                    });
                    
                    // Add touch event for mobile
                    tileElement.addEventListener('touchstart', (e) => {
                        if (!isGameWon && !isSolving) {
                            e.preventDefault();
                            moveTile(row, col);
                        }
                    }, { passive: false });
                    
                    puzzleContainer.appendChild(tileElement);
                });
            }

            // Move tile to empty position if adjacent
            function moveTile(row, col) {
                // Check if tile is adjacent to empty space
                if (
                    (Math.abs(row - emptyPos.row) === 1 && col === emptyPos.col) ||
                    (Math.abs(col - emptyPos.col) === 1 && row === emptyPos.row)
                ) {
                    // Calculate indexes
                    const tileIndex = row * puzzleSize + col;
                    const emptyIndex = emptyPos.row * puzzleSize + emptyPos.col;
                    
                    // Swap tiles in array
                    [tiles[tileIndex], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[tileIndex]];
                    
                    // Update empty position
                    emptyPos = { row, col };
                    
                    // Re-render tiles
                    renderTiles();
                    
                    // Increment move counter
                    moveCount++;
                    moveCounter.textContent = moveCount;
                    
                    // Check if puzzle is solved
                    checkWin();
                }
            }

            // Check if puzzle is solved
            function checkWin() {
                for (let i = 0; i < tiles.length - 1; i++) {
                    if (tiles[i] !== i + 1) {
                        return false;
                    }
                }
                
                // If we get here, puzzle is solved
                winGame();
                return true;
            }

            // Handle win condition
            function winGame() {
                isGameWon = true;
                clearInterval(timerInterval);
                winMessage.classList.remove('hidden');
                createConfetti();
            }

            // Create confetti effect
            function createConfetti() {
                const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];
                
                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.top = `${Math.random() * 100}%`;
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.opacity = '1';
                    
                    // Random size
                    const size = Math.random() * 10 + 5;
                    confetti.style.width = `${size}px`;
                    confetti.style.height = `${size}px`;
                    
                    // Random shape
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    
                    puzzleContainer.appendChild(confetti);
                    
                    // Animate
                    const animationDuration = Math.random() * 3 + 2;
                    confetti.style.transition = `all ${animationDuration}s ease-out`;
                    
                    setTimeout(() => {
                        confetti.style.top = `${Math.random() * 100 + 100}%`;
                        confetti.style.left = `${parseFloat(confetti.style.left) + (Math.random() * 100 - 50)}%`;
                        confetti.style.opacity = '0';
                    }, 10);
                    
                    // Remove after animation
                    setTimeout(() => {
                        confetti.remove();
                    }, animationDuration * 1000);
                }
            }

            // Start timer
            function startTimer() {
                clearInterval(timerInterval);
                seconds = 0;
                updateTimer();
                timerInterval = setInterval(() => {
                    seconds++;
                    updateTimer();
                }, 1000);
            }

            // Update timer display
            function updateTimer() {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                timer.textContent = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            }

            // Reset game
            function resetGame() {
                isGameWon = false;
                isSolving = false;
                moveCount = 0;
                moveCounter.textContent = '0';
                winMessage.classList.add('hidden');
                startTimer();
                shuffleTiles();
                renderTiles();
            }

            // Show solution (simple version - just arrange tiles)
            function showSolution() {
                if (isGameWon) return;
                
                isSolving = true;
                
                // Arrange tiles in order
                tiles = [];
                for (let i = 1; i < puzzleSize * puzzleSize; i++) {
                    tiles.push(i);
                }
                tiles.push(0);
                
                // Empty position is bottom right
                emptyPos = {
                    row: puzzleSize - 1,
                    col: puzzleSize - 1
                };
                
                // Re-render
                renderTiles();
                
                // Reset move counter
                moveCount = 0;
                moveCounter.textContent = '0';
                
                isSolving = false;
            }
        });
    </script>
</body>
</html>
